services:
  costco-australia-scraper:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # Optional: Costco Australia answers home, office and cloud connections alike, so leave
      # this unset. Set a datacenter proxy only if your server's address is ever refused.
      # - COSTCO_AUSTRALIA_PROXY=http://user:pass@host:port
